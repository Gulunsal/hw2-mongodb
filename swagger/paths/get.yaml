 tags:
     - Contacts
   summary: Get all contacts
   operationId: getAllContacts
   description: Retrieve a list of all contacts.
   security:
     - bearerAuth: []
   responses:
     '200':
       description: Successful response
       content:
         application/json:
           schema:
             type: array
             items:
               type: object
               properties:
                 id:
                   type: string
                 name:
                   type: string
                 email:
                   type: string
     '404':
       description: No contacts found