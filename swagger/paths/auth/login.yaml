post:
  tags:
    - Authentication
  summary: User login
  operationId: userLogin
  description: Authenticate a user and return a token.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
            password:
              type: string
          required:
            - email
            - password
  responses:
    "200":
      description: Login successful
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
    "401":
      description: Invalid credentials
    "400":
      description: Invalid input
