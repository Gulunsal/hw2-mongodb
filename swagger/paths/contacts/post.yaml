tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the list.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
responses:
  "201":
    description: Contact created successfully
  "400":
    description: Invalid input
