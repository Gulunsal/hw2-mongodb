tags:
  - Authentication
summary: User registration
operationId: userRegistration
description: Register a new user and return a token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
          password:
            type: string
responses:
  "201":
    description: User created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            token:
              type: string
  "400":
    description: Invalid input
